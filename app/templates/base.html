<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Best Life</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 1100px;
      margin: 2rem auto;
      padding: 0 1rem;
      color: #222;
    }

    nav {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
    }

    table {
      border-collapse: collapse;
      width: 100%;
      margin-top: 1rem;
    }

    th, td {
      border: 1px solid #ccc;
      padding: 0.5rem;
      text-align: left;
    }

    th {
      background: #f2f2f2;
    }

    button, select {
      padding: 0.4rem;
    }

    pre {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .table {
      overflow-x: auto;
    }
  </style>
</head>
<body>
  <nav>
    <a href="/customers">Clientes</a>
    <a href="/schedule">Cronograma</a>
    <a href="/history">Histórico</a>
    <a href="/docs">API</a>
  </nav>

  {% block content %}
  {% endblock %}
</body>
</html>
